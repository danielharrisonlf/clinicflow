  --font-ui: "Geist", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --font-data: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: 9 9 11; --surface: 18 18 21; --sunken: 14 14 17; --fg: 244 244 246;
    --muted: 161 161 170; --faint: 113 113 122;
    --ok: 16 185 129; --ai: 129 140 248; --warn: 251 191 36; --bad: 251 113 133;
    color-scheme: dark;
  }
}

  --bg: 9 9 11; --surface: 18 18 21; --sunken: 14 14 17; --fg: 244 244 246;

}
html, body { background: rgb(var(--bg)); color: rgb(var(--fg)); }
body { font-family: var(--font-ui); font-size: 14px; -webkit-font-smoothing: antialiased; }
.tnum { font-variant-numeric: tabular-nums; }
@keyframes enter { from { opacity: 0; transform: translateY(4px) scale(.99); } to { opacity: 1; transform: none; } }
@keyframes flash { 0% { background: rgb(var(--ok) / .16); } 100% { background: transparent; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.anim-enter { animation: enter .28s cubic-bezier(.2,.8,.2,1) both; }
.anim-flash { animation: flash 1.6s ease-out both; }
.anim-pop { animation: pop .22s cubic-bezier(.2,.8,.2,1) both; }
@media (prefers-reduced-motion: reduce) {
  .anim-enter, .anim-flash, .anim-pop, .animate-ping, .animate-pulse, .animate-spin { animation: none !important; }
  * { transition: none !important; }
}
#boot { padding: 48px 16px; color: rgb(var(--muted)); font: 14px/1.5 var(--font-ui); }

const hms = (s) => `${hm(s)}:${pad(Math.floor(s % 60))}`;

function ThemeToggle() {

  });
  const toggle = () => { const next = !dark; document.documentElement.dataset.theme = next ? "dark" : "light"; setDark(next); };
  useEffect(() => { window.__toggleTheme = toggle; });
  return (
    <button type="button" onClick={toggle} aria-label={dark ? "Usar tema claro" : "Usar tema escuro"}
      className="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-fg/[0.08] text-muted transition-colors hover:bg-sunken hover:text-fg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ai/40">

/* ───────────────────────── pathways ───────────────────────── */
function StepDot({ state, tone }) {
  if (state === "done") return <span className={cx("inline-flex h-5 w-5 items-center justify-center rounded-full text-bg", DOT.ok)}><Icon n="Check" size={12} sw={2.5} /></span>;
  if (state === "pending") return <span className={cx("inline-flex h-5 w-5 items-center justify-center rounded-full border-2 bg-surface", tone === "warn" ? "border-warn" : "border-ai")}><Pulse tone={tone === "warn" ? "warn" : "ai"} /></span>;
  return <span className="inline-flex h-5 w-5 items-center justify-center rounded-full border border-dashed border-fg/30 bg-surface"><span className="h-1.5 w-1.5 rounded-full bg-faint" /></span>;
}

function Stepper({ steps, tone = "ai", onOpenDoc, compact }) {
  return (
    <ol className={cx("grid gap-3", compact ? "grid-cols-1" : "grid-cols-1 sm:grid-cols-2 xl:grid-cols-4")} aria-label="Etapas da trilha">
      {steps.map((s, i) => (
        <li key={s.id} className="relative flex items-start gap-2.5">
          {!compact && i < steps.length - 1 && <span className="pointer-events-none absolute left-[9px] top-6 h-[calc(100%-6px)] w-px bg-fg/[0.1] sm:hidden xl:left-7 xl:top-[9px] xl:block xl:h-px xl:w-[calc(100%-40px)]" aria-hidden="true" />}
          {compact && i < steps.length - 1 && <span className="pointer-events-none absolute left-[9px] top-6 h-[calc(100%-6px)] w-px bg-fg/[0.1]" aria-hidden="true" />}
          <StepDot state={s.state} tone={tone} />
          <div className="relative min-w-0 flex-1 rounded-lg bg-surface pr-1">
            <span className={cx("block text-[13px] leading-snug", s.state === "future" ? "text-muted" : "font-medium")}>{s.label}</span>
            <span className="flex flex-wrap items-center gap-x-1.5 text-[12px] text-muted">
              {s.date && <span className="font-mono tnum">{dm(s.date)}</span>}
              {s.state === "done" && <span className="text-ok">concluído</span>}
              {s.state === "pending" && <span className={TEXT[tone === "warn" ? "warn" : "ai"]}>pendente</span>}
              {s.hint && <span className="text-faint">· {s.hint}</span>}
              {s.docId && onOpenDoc && <button type="button" onClick={() => onOpenDoc(s.docId)} className="inline-flex items-center gap-0.5 rounded px-0.5 text-ai hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ai/40"><Icon n="FileText" size={11} />ver</button>}
            </span>
          </div>
        </li>
      ))}
    </ol>
  );
}

const CONTACT_LABEL = {
  idle: null,
  sending: "Copilot está enviando a mensagem…",
  sent: "Copilot enviou mensagem pelo WhatsApp",
  chosen: "Camila escolheu Ter 14/10 · 09:30",
};

  const live = contact.state === "sending" || contact.state === "sent";
  return (
    <section aria-label={pw.title} aria-busy={live} className={cx("anim-enter relative overflow-hidden rounded-2xl border bg-surface p-4 transition-shadow duration-700 sm:p-5",
      done ? "border-ok/30 shadow-[0_24px_60px_-28px_rgb(var(--ok)/0.55)]" : "border-ai/25 shadow-[0_24px_60px_-28px_rgb(var(--ai)/0.55)]")}>
      <div className="pointer-events-none absolute -right-16 -top-16 h-40 w-40 rounded-full blur-3xl" style={{ background: done ? "rgb(var(--ok) / .14)" : "rgb(var(--ai) / .16)" }} />
      <div className="relative flex flex-wrap items-center gap-2">
        <span className={cx("inline-flex h-6 w-6 items-center justify-center rounded-md", done ? "bg-ok/10 text-ok" : "bg-ai/10 text-ai")}><Icon n="Route" size={14} sw={2} /></span>

        <span className={cx("ml-auto inline-flex items-center gap-1.5 text-[12px] font-medium", done ? "text-ok" : "text-ai")}>

      <div className={cx("relative mt-3 flex items-start gap-2.5 rounded-xl border px-3 py-2.5", done ? "border-ok/20 bg-ok/[0.06]" : "border-ai/20 bg-ai/[0.06]")} role="status">
        <Icon n={done ? "CircleCheck" : "Sparkles"} size={16} className={cx("mt-0.5 shrink-0", done ? "text-ok" : "text-ai")} />
        <p className="text-[13px] leading-snug">
          {done
            ? <>Retorno para entrega do laudo confirmado para <span className="font-mono font-medium tnum">Ter 14/10 · 09:30</span> com a Dra. Helena. A paciente recebeu o convite e a confirmação pelo WhatsApp.</>
            : <>{pw.alert}. <span className="text-muted">Laudo anatomopatológico já está na ficha desde <span className="font-mono tnum">06/10</span>; o prazo ideal de entrega termina em <span className="font-mono tnum">16/10</span>.</span></>}

            {slots.map((s, i) => (

                  contact.slot === i ? "border-ai/40 bg-ai/[0.06] text-fg" : "border-fg/[0.1] bg-surface text-fg/80 hover:bg-sunken")}>
                <span className="font-mono tnum">{s.label}</span>
                {contact.slot === i && <Icon n="Check" size={13} className="text-ai" />}

            ))}
          </div>
          <div className="flex flex-wrap items-center gap-2">
            <Btn k="D" icon={contact.state === "sending" ? "LoaderCircle" : "Send"} primary busy={live} onClick={onContact} aria-describedby="contact-status">
              {contact.state === "idle" ? "Disparar contato agora" : contact.state === "sending" ? "Enviando…" : "Aguardando resposta"}
            </Btn>
            <span id="contact-status" className={cx("inline-flex min-h-[20px] items-center gap-1.5 text-[12px]", live ? "text-ai" : "text-muted")} aria-live="polite">

              {contact.state === "sending" && <><Pulse tone="ai" />Enviando pelo WhatsApp…</>}
              {contact.state === "sent" && <><Icon n="CheckCheck" size={13} />{CONTACT_LABEL.sent} · <span className="font-mono tnum">{hm(contact.sentAt)}</span> · paciente digitando…</>}
            </span>
          </div>
        </div>
      )}
      {done && (
        <div className="relative mt-4 flex flex-wrap items-center gap-2 text-[12px] text-muted">
          <Chip tone="ok" icon="CalendarCheck">Ter 14/10 · 09:30 · Dra. Helena · Sala 1</Chip>
          <Chip tone="ai" icon="CheckCheck">{CONTACT_LABEL.chosen} às <span className="font-mono tnum">{hm(contact.chosenAt)}</span></Chip>
          <span className="text-faint">Tarefa RETORNO_A_AGENDAR resolvida pelo Copilot</span>
        </div>
      )}
    </section>
  );
}

function SmallPathway({ pw, state, onAction, onOpenDoc }) {

  return (
    <li className="flex flex-col gap-2.5 py-3 first:pt-0 last:pb-0">

        <span className={cx("mt-1 h-2 w-2 shrink-0 rounded-full", DOT[tone])} />
        <div className="min-w-0 flex-1">
          <div className="flex flex-wrap items-center gap-x-2 gap-y-0.5">
            <span className="text-[13px] font-medium leading-snug">{pw.title}</span>
            <span className={cx("text-[12px] font-medium", TEXT[tone])}>{statusLabel}</span>

          <div className="mt-0.5 flex flex-wrap items-center gap-x-2 text-[12px] text-muted"><DocTag id={pw.doc} /><span>{pw.detail}</span></div>

      <div className="pl-4"><Stepper steps={pw.steps} tone={pw.tone} compact onOpenDoc={onOpenDoc} /></div>
      <div className="flex flex-wrap items-center gap-2 pl-4">

  now: ["ok", "Em atendimento", "DoorOpen"],
  done: ["muted", "Concluída", "CircleCheck"],
  noshow: ["bad", "Faltou", "CalendarX2"],
  scheduled: ["ai", "Agendada", "CalendarCheck"],
};

function ConsultList({ items, limit }) {
  const list = limit ? items.slice(0, limit) : items;
  return (
    <ol className="flex flex-col divide-y divide-fg/[0.06]" aria-label="Histórico de consultas">
      {list.map((a) => {
        const [tone, label, icon] = STATUS[a.status];
        return (
          <li key={a.id} className="flex items-start gap-3 py-2.5">
            <span className="flex w-[4.5rem] shrink-0 flex-col font-mono text-[12px] leading-tight text-muted tnum">
              <span className={cx(a.status === "now" ? "font-medium text-fg" : "")}>{dmy(a.date).slice(0, 5)}<span className="text-faint">/{a.date.slice(2, 4)}</span></span>
              <span className="text-faint">{hm(a.time)}</span>

            <div className="flex min-w-0 flex-1 flex-col gap-0.5">

            </div>
            <Chip tone={tone} icon={icon} className="shrink-0">{label}</Chip>
          </li>

function Thumb({ exam, size = 44 }) {
  const base = "flex shrink-0 items-center justify-center overflow-hidden rounded-lg border border-fg/[0.08] bg-sunken";
  const s = { width: size, height: size };
  if (exam.kind === "derma") return <span className={base} style={s} aria-hidden="true"><span className="h-full w-full" style={{ background: "radial-gradient(circle at 55% 50%, rgb(var(--fg)/.75) 0 18%, rgb(var(--warn)/.55) 19% 30%, rgb(var(--warn)/.2) 31% 45%, transparent 46%), linear-gradient(135deg, rgb(var(--warn)/.25), rgb(var(--warn)/.08))" }} /></span>;
  if (exam.kind === "map") return <span className={base} style={s} aria-hidden="true"><span className="h-full w-full" style={{ background: "radial-gradient(circle at 30% 35%, rgb(var(--fg)/.5) 0 5%, transparent 6%), radial-gradient(circle at 62% 55%, rgb(var(--fg)/.5) 0 4%, transparent 5%), radial-gradient(circle at 45% 75%, rgb(var(--fg)/.5) 0 3%, transparent 4%), linear-gradient(160deg, rgb(var(--warn)/.2), rgb(var(--warn)/.06))" }} /></span>;
  if (exam.kind === "ecg") return <span className={base} style={s} aria-hidden="true"><svg viewBox="0 0 44 44" width={size} height={size}><polyline points="0,24 8,24 11,22 14,24 17,24 19,10 21,34 23,24 28,24 31,20 34,24 44,24" fill="none" stroke="rgb(var(--ok))" strokeWidth="1.6" strokeLinejoin="round" /></svg></span>;
  if (exam.kind === "lab") return <span className={cx(base, "text-muted")} style={s} aria-hidden="true"><Icon n="TestTubes" size={20} /></span>;
  return <span className={cx(base, "text-muted")} style={s} aria-hidden="true"><Icon n="FileText" size={20} /></span>;
}

function ExamTimeline({ items, limit, onOpen, selectedId }) {
  const list = limit ? items.slice(0, limit) : items;
  return (
    <ol className="relative flex flex-col" aria-label="Exames anexados">
      {list.map((e, i) => (

          {i < list.length - 1 && <span className="absolute left-[26px] top-[52px] h-[calc(100%-44px)] w-px bg-fg/[0.08]" aria-hidden="true" />}

            className="group flex min-w-0 flex-1 items-start gap-3 rounded-xl border border-transparent p-1 text-left transition-[background-color,border-color] hover:border-fg/[0.08] hover:bg-sunken/70 focus-visible:border-ai/50 focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-ai/15">
            <Thumb exam={e} />
            <span className="flex min-w-0 flex-1 flex-col gap-0.5">
              <span className="flex items-center justify-between gap-2">

                <span className="shrink-0 font-mono text-[12px] text-muted tnum">{dmy(e.date)}</span>
              </span>
              <span className="flex min-w-0 flex-wrap items-center gap-x-2 gap-y-1 text-[12px] text-muted">
                <Chip tone={e.flagged ? "warn" : "muted"} icon={e.flagged ? "TriangleAlert" : undefined}>{e.typeLabel}{e.flagged ? " · valor alterado" : ""}</Chip>
                <span className="truncate">{e.source}</span>
                <span className="font-mono text-faint tnum">{e.size}</span>

            <span className="mt-1 hidden shrink-0 items-center gap-1 text-[12px] text-faint group-hover:text-fg sm:inline-flex"><Icon n="Maximize2" size={12} />visualizar</span>

        </li>
      ))}

function Chat({ messages, onSend, composerRef }) {
  const [text, setText] = useState("");
  const endRef = useRef(null);
  useEffect(() => { endRef.current && endRef.current.scrollIntoView({ block: "nearest" }); }, [messages.length]);
  const who = { copilot: ["Copilot", "ai", "Sparkles"], staff: ["Carla · recepção", "fg", "UserRound"], patient: ["Camila", "muted", null] };
  let lastDate = null;
  const submit = (e) => { e.preventDefault(); if (!text.trim()) return; onSend(text.trim()); setText(""); };
  return (
    <div className="flex flex-col gap-3">
      <ol className="flex max-h-[52vh] flex-col gap-2 overflow-y-auto pr-1" aria-label="Mensagens do WhatsApp">
        {messages.map((m) => {
          const head = m.date !== lastDate ? (lastDate = m.date) : null;
          const [name, tone, icon] = who[m.from];
          const mine = m.from !== "patient";
          return (
            <React.Fragment key={m.id}>
              {head && <li className="my-1 text-center font-mono text-[11px] text-faint tnum" role="presentation">{dmy(head)}</li>}
              <li className={cx("flex max-w-[85%] flex-col gap-0.5", mine ? "self-end items-end" : "self-start items-start")}>
                <span className={cx("inline-flex items-center gap-1 text-[11px] font-medium", TEXT[tone])}>{icon && <Icon n={icon} size={11} />}{name} · <span className="font-mono tnum">{hm(m.t)}</span></span>
                <p className={cx("rounded-xl px-3 py-2 text-[13px] leading-snug", mine ? "rounded-tr-sm border border-ai/20 bg-ai/[0.06]" : "rounded-tl-sm border border-fg/[0.08] bg-sunken")}>{m.text}</p>
              </li>
            </React.Fragment>
          );
        })}
        <li ref={endRef} aria-hidden="true" />
      </ol>
      <form onSubmit={submit} className="flex items-center gap-2 rounded-xl border border-fg/[0.1] bg-surface p-1.5 focus-within:border-ai/50 focus-within:ring-[3px] focus-within:ring-ai/15">
        <Icon n="MessageCircle" size={15} className="ml-1.5 text-muted" />
        <input ref={composerRef} value={text} onChange={(e) => setText(e.target.value)} placeholder="Mensagem para Camila pelo WhatsApp…" aria-label="Mensagem para a paciente" className="h-8 min-w-0 flex-1 bg-transparent text-[13px] outline-none placeholder:text-faint" />
        <Btn icon="Send" primary type="submit">Enviar</Btn>
      </form>
    </div>
  );

function ecgPath(width, beats) {
  const pts = [];
  const base = 60, step = width / beats;
  for (let b = 0; b < beats; b++) {
    const x = b * step;
    const seg = [[0, base], [step * 0.12, base], [step * 0.17, base - 5], [step * 0.22, base], [step * 0.30, base], [step * 0.33, base + 3], [step * 0.36, base - 38], [step * 0.39, base + 12], [step * 0.42, base], [step * 0.55, base], [step * 0.62, base - 9], [step * 0.70, base], [step, base]];
    seg.forEach(([dx, y]) => pts.push(`${(x + dx).toFixed(1)},${y}`));
  }
  return pts.join(" ");
}

function CommandPalette({ items, onClose }) {
  const [q, setQ] = useState("");
  const [idx, setIdx] = useState(0);
  const listRef = useRef(null);
  const filtered = useMemo(() => {
    const n = norm(q.trim());
    return n ? items.filter((it) => norm(it.label + " " + (it.hint || "") + " " + it.group).includes(n)) : items;
  }, [q, items]);
  useEffect(() => setIdx(0), [q]);
  useEffect(() => { const el = listRef.current && listRef.current.querySelector(`[data-i="${idx}"]`); el && el.scrollIntoView({ block: "nearest" }); }, [idx]);
  const run = (it) => { onClose(); it && it.run(); };
  const onKey = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setIdx((i) => Math.min(i + 1, filtered.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setIdx((i) => Math.max(i - 1, 0)); }
    else if (e.key === "Enter") { e.preventDefault(); run(filtered[idx]); }
    else if (e.key === "Escape") { e.preventDefault(); onClose(); }
  };
  let lastGroup = null;
  return (
    <Overlay onClose={onClose} label="Busca rápida">
      <div className="flex items-center gap-2.5 border-b border-fg/[0.08] px-4">
        <Icon n="Search" size={16} className="text-muted" />
        <input id="cmdk-input" autoFocus value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={onKey} placeholder="Paciente, exame ou ação…" aria-label="Buscar"
          className="h-12 flex-1 bg-transparent text-[15px] outline-none placeholder:text-faint" />
        <Kbd>Esc</Kbd>
      </div>
      <ul ref={listRef} className="max-h-[52vh] overflow-y-auto p-1.5" role="listbox" aria-label="Resultados">
        {filtered.length === 0 && <li className="px-3 py-8 text-center text-[13px] text-muted">Nada encontrado para “{q}”.</li>}
        {filtered.map((it, i) => {
          const head = it.group !== lastGroup ? (lastGroup = it.group) : null;
          return (
            <React.Fragment key={it.id}>
              {head && <li className="px-2.5 pb-1 pt-2.5 text-[11px] font-medium uppercase tracking-[0.06em] text-faint" role="presentation">{head}</li>}
              <li data-i={i} role="option" aria-selected={i === idx} onMouseMove={() => setIdx(i)} onClick={() => run(it)}
                className={cx("flex cursor-default items-center gap-3 rounded-lg px-2.5 py-2", i === idx ? "bg-sunken" : "")}>
                <span className={cx("inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-md border border-fg/[0.08]", it.tone ? TEXT[it.tone] : "text-muted")}><Icon n={it.icon} size={14} /></span>
                <span className="min-w-0 flex-1">
                  <span className="block truncate text-[13.5px] font-medium">{it.label}</span>
                  {it.hint && <span className="block truncate text-[12px] text-muted">{it.hint}</span>}
                </span>
                {it.kbd && <span className="flex gap-0.5">{it.kbd.map((k) => <Kbd key={k}>{k}</Kbd>)}</span>}
                {i === idx && <Icon n="CornerDownLeft" size={14} className="text-faint" />}
              </li>
            </React.Fragment>
          );
        })}
      </ul>
      <div className="flex items-center gap-4 border-t border-fg/[0.08] px-4 py-2 text-[12px] text-faint">
        <span className="inline-flex items-center gap-1"><Kbd>↑</Kbd><Kbd>↓</Kbd> navegar</span>

        <span className="ml-auto">{filtered.length} resultados</span>
      </div>
    </Overlay>
  );
}

        <div className="flex items-center justify-end gap-2 border-t border-fg/[0.08] p-3">

  ["Mensagem pelo WhatsApp", ["M"]],
  ["Anexar exame", ["U"]],
  ["Abas: visão geral, consultas, exames, conversas", ["1", "2", "3", "4"]],
  ["Ir para aba (sequência)", ["G", "O / C / E / V"]],
  ["Navegar entre exames na pré-visualização", ["←", "→"]],
  ["Fechar pré-visualização ou diálogo", ["Esc"]],
  ["Desfazer última ação", ["Z"]],
  ["Busca rápida", ["Ctrl", "K"]],

];

function ShortcutsDialog({ onClose }) {

  return (
    <Overlay onClose={onClose} label="Atalhos de teclado" align="center">

function Toast({ toast, onUndo, onClose }) {
  if (!toast) return null;
  return (
    <div className="pointer-events-none fixed inset-x-0 z-40 flex justify-center px-4" style={{ bottom: "calc(16px + env(safe-area-inset-bottom, 0px))" }}>
      <div key={toast.id} role="status" className="anim-pop pointer-events-auto flex max-w-[560px] items-center gap-3 rounded-xl border border-fg/[0.1] bg-fg py-2 pl-3 pr-2 text-[13px] text-bg shadow-[0_20px_50px_-20px_rgb(0_0_0/0.5)]">
        <Icon n={toast.icon || "Check"} size={15} className={toast.tone === "ai" ? "text-[rgb(var(--ai))]" : "text-[rgb(var(--ok))]"} />
        <span className="min-w-0 flex-1">{toast.msg}</span>
        {toast.undo && (
          <button type="button" onClick={onUndo} className="inline-flex h-7 shrink-0 items-center gap-1.5 rounded-lg px-2 font-medium text-bg/80 hover:bg-bg/10">
            Desfazer <Kbd className="border-bg/20 bg-bg/10 text-bg/80 shadow-none">Z</Kbd>
          </button>
        )}
        <button type="button" onClick={onClose} aria-label="Fechar aviso" className="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-lg text-bg/60 hover:bg-bg/10"><Icon n="X" size={14} /></button>
      </div>
    </div>
  );
}

/* ───────────────────────── app ───────────────────────── */
function App() {
  const [now, setNow] = useState(START);
  const [tab, setTab] = useState("overview");
  const [cpfShown, setCpfShown] = useState(false);
  const [contact, setContact] = useState({ state: "idle", slot: 0, sentAt: null, chosenAt: null });
  const [small, setSmall] = useState({ pw_nevos: "idle", pw_tsh: "idle" });
  const [messages, setMessages] = useState(MESSAGES);
  const [exams, setExams] = useState(EXAMS);
  const [preview, setPreview] = useState(null);
  const [palette, setPalette] = useState(false);
  const [schedule, setSchedule] = useState(false);
  const [upload, setUpload] = useState(false);
  const [help, setHelp] = useState(false);
  const [toast, setToast] = useState(null);
  const [gPrefix, setGPrefix] = useState(false);
  const composerRef = useRef(null);
  const timers = useRef([]);

  useEffect(() => { const t = setInterval(() => setNow((n) => n + 1), 1000); return () => clearInterval(t); }, []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 6000); return () => clearTimeout(t); }, [toast]);
  useEffect(() => { if (!gPrefix) return; const t = setTimeout(() => setGPrefix(false), 1200); return () => clearTimeout(t); }, [gPrefix]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const showToast = (msg, opts = {}) => setToast({ id: Math.random(), msg, ...opts });
  const later = (ms, fn) => { const t = setTimeout(fn, ms); timers.current.push(t); return t; };
  const say = (from, text, delay = 0) => later(delay, () => setMessages((m) => [...m, { id: "m" + Math.random(), date: "2026-10-09", t: START + Math.floor(delay / 1000), from, text }]));

  // Pathway hero: Copilot envia → paciente responde → passo concluído. Z desfaz tudo.
  function fireContact() {
    if (contact.state !== "idle") return;
    const prev = { contact, messages };
    setContact((c) => ({ ...c, state: "sending" }));
    later(1200, () => {
      setContact((c) => ({ ...c, state: "sent", sentAt: now + 1 }));
      say("copilot", "Oi, Camila! O laudo da sua biópsia já chegou e a Dra. Helena quer entregá-lo pessoalmente. Tenho estes horários: 1) Ter 14/10 09:30 · 2) Qua 15/10 08:45 · 3) Qui 16/10 11:00. Responda com o número.");
    });
    later(4600, () => {
      say("patient", "1 — terça 9:30 fica ótimo!");
      say("copilot", "Combinado! Retorno confirmado para Ter 14/10 às 09:30 com a Dra. Helena, Sala 1. Até lá.", 400);
      setContact((c) => ({ ...c, state: "chosen", chosenAt: now + 5 }));
      showToast("Camila escolheu Ter 14/10 · 09:30 · retorno agendado e tarefa resolvida pelo Copilot", { icon: "CalendarCheck", tone: "ai", undo: prev });
    });
  }

  function fireSmall(id) {
    if (small[id] !== "idle") return;
    const pw = PATHWAYS.find((p) => p.id === id);
    const prev = { small };
    setSmall((s) => ({ ...s, [id]: "sending" }));
    later(900, () => {
      setSmall((s) => ({ ...s, [id]: "done" }));
      if (id === "pw_tsh") say("copilot", "Oi, Camila! O Dr. Menezes pediu o TSH e T4 livre em 30/08 e ainda não recebemos o resultado. O pedido está neste link e o Lab. São Lucas (conveniado Unimed) atende sem agendamento. Posso ajudar com algo?");
      showToast(pw.action.done, { icon: id === "pw_tsh" ? "Send" : "BellPlus", tone: "ai", undo: prev });
    });
  }

  function confirmSchedule(i, notify) {
    const prev = { contact, messages };
    setSchedule(false);
    setContact({ state: "chosen", slot: i, sentAt: now, chosenAt: now });
    if (notify) say("copilot", `Olá, Camila! Seu retorno para entrega do laudo foi agendado para ${SLOTS[i].label} com a Dra. Helena. Responda 1 para confirmar.`);
    showToast(`Retorno agendado para ${SLOTS[i].label}${notify ? " · convite enviado pelo WhatsApp" : ""}`, { icon: "CalendarCheck", tone: "ai", undo: prev });
  }

  function confirmUpload(type) {
    const prev = { exams, small };
    setUpload(false);
    const label = Object.fromEntries(UPLOAD_TYPES)[type];
    const doc = { id: "e" + Math.random(), date: "2026-10-09", type, typeLabel: label, title: "TSH · T4 livre", source: "Lab. São Lucas", file: "tsh-t4-livre-2026-10-09.pdf", size: "280 KB", kind: "lab", doc: "menezes", flagged: false };
    setExams((e) => [doc, ...e]);
    setSmall((s) => ({ ...s, pw_tsh: "done" }));
    setTab("exams");
    showToast("Exame anexado · trilha do TSH atualizada e Dr. Menezes avisado", { icon: "Paperclip", tone: "ok", undo: prev });
  }

  function sendMessage(text) {
    const prev = { messages };
    say("staff", text);
    showToast("Mensagem enviada pelo WhatsApp", { icon: "Send", tone: "ok", undo: prev });
  }

  function undo() {
    if (!toast || !toast.undo) return;
    const u = toast.undo;
    timers.current.forEach(clearTimeout); timers.current = [];
    if (u.contact) setContact(u.contact);
    if (u.messages) setMessages(u.messages);
    if (u.small) setSmall(u.small);
    if (u.exams) setExams(u.exams);
    setToast({ id: Math.random(), msg: "Ação desfeita", icon: "Undo2", tone: "ai" });
  }

  async function copyPhone() {
    const digits = PATIENT.phone;
    try {
      if (!navigator.clipboard) throw new Error("sem clipboard");
      await navigator.clipboard.writeText(digits);
      showToast("Telefone copiado", { icon: "Copy" });
    } catch (err) {
      try {
        const ta = document.createElement("textarea"); ta.value = digits; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
        showToast("Telefone copiado", { icon: "Copy" });
      } catch (err2) {
        showToast(`Não deu para copiar automaticamente: ${digits}`, { icon: "Copy", tone: "ai" });
      }
    }
  }

  function toggleCpf() {
    const next = !cpfShown;
    setCpfShown(next);
    if (next) showToast("CPF revelado · acesso registrado na auditoria (LGPD)", { icon: "ShieldCheck", tone: "ai" });
  }

  const openExam = (id) => { setPreview(id); };
  const examIndex = exams.findIndex((e) => e.id === preview);
  const movePreview = (dir) => setPreview(exams[(examIndex + dir + exams.length) % exams.length].id);
  const closePreview = () => {
    const id = preview; setPreview(null);
    requestAnimationFrame(() => { const el = document.querySelector(`[data-exam="${id}"]`); el && el.focus({ preventScroll: true }); });
  };

  const action = (k) => {
    if (k === "a") { if (contact.state === "chosen") { showToast("Retorno já agendado para Ter 14/10 · 09:30", { icon: "CalendarCheck" }); return; } setSchedule(true); }
    else if (k === "m") { setTab("chat"); requestAnimationFrame(() => composerRef.current && composerRef.current.focus()); }
    else if (k === "u") setUpload(true);
    else if (k === "d") fireContact();
  };
  const navigate = (label) => showToast(`${label} é outra tela desta série. O Paciente 360 continua aqui.`, { icon: "LayoutGrid", tone: "ai" });

  useEffect(() => {
    const onKey = (e) => {
      const k = e.key.toLowerCase();
      if ((e.metaKey || e.ctrlKey) && k === "k") { e.preventDefault(); setPalette((o) => !o); return; }
      if (palette || schedule || upload || help || preview) return;
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea") return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (gPrefix) {
        const t = TABS.find((x) => x.key === k);
        setGPrefix(false);
        if (t) { e.preventDefault(); setTab(t.id); return; }
      }
      if (e.key === "/") { e.preventDefault(); setPalette(true); return; }
      if (e.key === "?") { e.preventDefault(); setHelp(true); return; }
      if (k === "g") { setGPrefix(true); return; }
      if (k === "z") { e.preventDefault(); undo(); return; }
      if (["1", "2", "3", "4"].includes(k)) { e.preventDefault(); setTab(TABS[Number(k) - 1].id); return; }
      if (["a", "m", "u", "d"].includes(k)) { e.preventDefault(); action(k); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const paletteItems = useMemo(() => {
    const actions = [
      contact.state === "idle" && { id: "a-d", group: "Ações", icon: "Send", tone: "ai", label: "Disparar contato · retorno para entrega de laudo", hint: "Copilot oferece 3 horários pelo WhatsApp", kbd: ["D"], run: () => fireContact() },
      { id: "a-a", group: "Ações", icon: "CalendarPlus", tone: "ok", label: "Agendar retorno com a Dra. Helena", hint: "Sugestões pela preferência de manhã", kbd: ["A"], run: () => action("a") },
      { id: "a-m", group: "Ações", icon: "MessageCircle", label: "Mandar mensagem pelo WhatsApp", kbd: ["M"], run: () => action("m") },
      { id: "a-u", group: "Ações", icon: "Paperclip", label: "Anexar exame à ficha", kbd: ["U"], run: () => action("u") },
      { id: "a-cpf", group: "Ações", icon: cpfShown ? "EyeOff" : "Eye", label: cpfShown ? "Ocultar CPF" : "Revelar CPF", hint: "Registrado na auditoria", run: () => toggleCpf() },
      { id: "a-theme", group: "Ações", icon: "SunMoon", label: "Alternar tema claro e escuro", run: () => window.__toggleTheme && window.__toggleTheme() },
      { id: "a-help", group: "Ações", icon: "Keyboard", label: "Mostrar atalhos de teclado", kbd: ["?"], run: () => setHelp(true) },
    ].filter(Boolean);
    const ex = exams.map((e) => ({ id: "e-" + e.id, group: "Exames de Camila", icon: "FileText", label: e.title, hint: `${dmy(e.date)} · ${e.source}`, run: () => openExam(e.id) }));
    const tabs = TABS.map((t, i) => ({ id: "t-" + t.id, group: "Abas", icon: t.icon, label: t.label, kbd: [String(i + 1)], run: () => setTab(t.id) }));
    const nav = [
      { id: "n-cockpit", group: "Ir para", icon: "LayoutGrid", label: "Cockpit", hint: "Fluxo ao vivo da clínica", run: () => navigate("O Cockpit") },
      { id: "n-agenda", group: "Ir para", icon: "CalendarDays", label: "Agenda inteligente", hint: "Dia, semana e por profissional", run: () => navigate("A Agenda inteligente") },
      { id: "n-comms", group: "Ir para", icon: "MessagesSquare", label: "Centro de Resgate", hint: "Conversas do Copilot e lista de espera", run: () => navigate("O Centro de Resgate") },
      { id: "n-list", group: "Ir para", icon: "UsersRound", label: "Lista de pacientes", hint: "Ana Ribeiro, Lúcia Andrade, Sônia Valente…", run: () => navigate("A lista de pacientes") },
    ];
    return [...actions, ...ex, ...tabs, ...nav];
  }, [contact.state, cpfShown, exams]);

  const closeOverlay = (setter) => () => setter(false);
  const previewExam = preview && exams[examIndex];
  const pending = (contact.state === "chosen" ? 0 : 1) + (small.pw_tsh === "done" ? 0 : 1);

  return (
    <div className="min-h-full">
      <Header now={now} onOpenPalette={() => setPalette(true)} onNavigate={navigate} />

      <main className="mx-auto flex max-w-[1680px] flex-col gap-4 px-4 pb-24 pt-4 sm:px-6">
        <IdentityBar cpfShown={cpfShown} onToggleCpf={toggleCpf} onCopyPhone={copyPhone} onAction={action} />

        <div className="grid grid-cols-[minmax(0,1fr)] gap-4 lg:grid-cols-[minmax(0,1fr)_340px]">
          <div className="flex min-w-0 flex-col gap-4">
            <PathwayHero pw={PATHWAYS[0]} contact={contact} slots={SLOTS} onContact={fireContact} onPickSlot={(i) => setContact((c) => ({ ...c, slot: i }))} onOpenDoc={openExam} />

            <section aria-label="Ficha" className="min-w-0 overflow-hidden rounded-2xl border border-fg/[0.08] bg-surface">
              <div role="tablist" aria-label="Seções da ficha" className="flex min-w-0 items-center gap-0.5 overflow-x-auto border-b border-fg/[0.08] px-2 pt-2">
                {TABS.map((t, i) => (
                  <button key={t.id} role="tab" type="button" id={`tab-${t.id}`} aria-selected={tab === t.id} aria-controls={`panel-${t.id}`} onClick={() => setTab(t.id)}
                    className={cx("relative inline-flex h-9 shrink-0 items-center gap-1.5 rounded-t-lg px-2.5 text-[13px] font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ai/40",
                      tab === t.id ? "text-fg" : "text-muted hover:bg-sunken/70 hover:text-fg")}>
                    <Icon n={t.icon} size={14} />{t.label}
                    {t.count != null && <span className="rounded-full bg-sunken px-1.5 font-mono text-[11px] text-muted tnum">{t.id === "exams" ? exams.length : t.id === "chat" ? messages.length : t.count}</span>}
                    <Kbd className="ml-0.5 hidden sm:inline-flex">{i + 1}</Kbd>
                    {tab === t.id && <span className="absolute inset-x-2 -bottom-px h-0.5 rounded-full bg-fg" aria-hidden="true" />}
                  </button>
                ))}
                <button type="button" onClick={() => setHelp(true)} className="ml-auto hidden items-center gap-1.5 rounded-md px-1.5 py-1 text-[12px] text-muted hover:bg-sunken hover:text-fg sm:inline-flex"><Kbd>?</Kbd>atalhos</button>
              </div>

              <div key={tab} className="anim-enter p-4" role="tabpanel" id={`panel-${tab}`} aria-labelledby={`tab-${tab}`}>
                {tab === "overview" && (
                  <div className="grid grid-cols-[minmax(0,1fr)] gap-5 xl:grid-cols-2">
                    <div className="flex flex-col gap-2.5">
                      <div className="flex items-center gap-2"><Icon n="CalendarDays" size={15} className="text-muted" /><h2 className="text-[13px] font-semibold">Últimas consultas</h2><button type="button" onClick={() => setTab("consults")} className="ml-auto inline-flex items-center gap-1 text-[12px] text-ai hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ai/40">ver todas <Icon n="ArrowRight" size={12} /></button></div>
                      <ConsultList items={APPOINTMENTS} limit={4} />
                    </div>
                    <div className="flex flex-col gap-2.5">
                      <div className="flex items-center gap-2"><Icon n="FileText" size={15} className="text-muted" /><h2 className="text-[13px] font-semibold">Exames recentes</h2><span className="text-[12px] text-faint">clique para visualizar</span><button type="button" onClick={() => setTab("exams")} className="ml-auto inline-flex items-center gap-1 text-[12px] text-ai hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ai/40">ver todos <Icon n="ArrowRight" size={12} /></button></div>
                      <ExamTimeline items={exams} limit={3} onOpen={openExam} selectedId={preview} />
                    </div>
                  </div>
                )}
                {tab === "consults" && (
                  <div className="flex flex-col gap-2.5">
                    <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-[12px] text-muted">
                      <span><span className="font-mono tnum text-fg">{APPOINTMENTS.length}</span> consultas desde <span className="font-mono tnum">{dmy(PATIENT.since)}</span></span>
                      <span>· <span className="font-mono tnum text-fg">{APPOINTMENTS.filter((a) => a.status === "noshow").length}</span> falta</span>
                      <span>· ticket médio particular <span className="font-mono tnum text-fg">{brl(472)}</span></span>
                    </div>
                    <ConsultList items={APPOINTMENTS} />
                  </div>
                )}
                {tab === "exams" && (
                  <div className="flex flex-col gap-3">
                    <div className="flex flex-wrap items-center gap-2">
                      <span className="text-[12px] text-muted"><span className="font-mono tnum text-fg">{exams.length}</span> documentos · Enter ou clique abre a pré-visualização · <Kbd>←</Kbd> <Kbd>→</Kbd> navegam</span>
                      <Btn k="U" icon="Paperclip" className="ml-auto" onClick={() => action("u")}>Anexar</Btn>
                    </div>
                    <ExamTimeline items={exams} onOpen={openExam} selectedId={preview} />
                  </div>
                )}
                {tab === "chat" && <Chat messages={messages} onSend={sendMessage} composerRef={composerRef} />}
              </div>
            </section>
          </div>

          <aside aria-label="Dados e trilhas" className="flex min-w-0 flex-col gap-4">
            <Panel title="Outras trilhas" icon="Route" right={pending ? `${pending} pendente${pending > 1 ? "s" : ""}` : "tudo em dia"}>
              <ul className="flex flex-col divide-y divide-fg/[0.06]">
                {PATHWAYS.slice(1).map((pw) => <SmallPathway key={pw.id} pw={pw} state={small[pw.id]} onAction={fireSmall} onOpenDoc={openExam} />)}
              </ul>
            </Panel>
            <Panel title="Dados cadastrais" icon="IdCard" right="dados fictícios">
              <Demographics cpfShown={cpfShown} />
              <p className="mt-2 flex items-start gap-1.5 text-[12px] text-faint"><Icon n="ShieldCheck" size={13} className="mt-px shrink-0" />CPF e carteirinha ficam mascarados por padrão; revelar registra quem viu e quando (LGPD).</p>
            </Panel>
            <Panel title="Copilot observa" icon="Sparkles">
              <ul className="flex flex-col gap-2 text-[12.5px] leading-snug text-fg/85">
                {[
                  ["CheckCheck", "ai", "Responde confirmações em menos de 5 min; o canal WhatsApp é confiável para esta paciente."],
                  ["Sunrise", "muted", "Todas as 5 consultas do ano foram antes das 10:30; ofereça manhã primeiro."],
                  ["TriangleAlert", "warn", "Única falta (03/03) foi retorno com o Dr. Menezes sem lembrete prévio — hoje o Copilot lembra 48 h antes."],
                ].map(([icon, tone, text]) => <li key={text} className="flex gap-2"><Icon n={icon} size={14} className={cx("mt-0.5 shrink-0", TEXT[tone])} />{text}</li>)}
              </ul>
            </Panel>
          </aside>
        </div>

        <footer className="hidden flex-wrap items-center gap-x-4 gap-y-2 border-t border-fg/[0.06] px-1 pt-3 text-[12px] text-muted md:flex">
          {[["D", "disparar contato"], ["A", "agendar"], ["M", "mensagem"], ["U", "anexar"], ["1–4", "abas"], ["←→", "exames"], ["Z", "desfazer"], ["?", "atalhos"]].map(([k, l]) => (
            <span key={k} className="inline-flex items-center gap-1.5"><Kbd>{k}</Kbd>{l}</span>
          ))}
          <span className="ml-auto text-faint">Dados de exemplo · {CLINIC}</span>
        </footer>
      </main>

      {palette && <CommandPalette items={paletteItems} onClose={closeOverlay(setPalette)} />}
      {schedule && <ScheduleDialog onClose={closeOverlay(setSchedule)} onConfirm={confirmSchedule} />}
      {upload && <UploadDialog onClose={closeOverlay(setUpload)} onConfirm={confirmUpload} />}
      {help && <ShortcutsDialog onClose={closeOverlay(setHelp)} />}
      {previewExam && <ExamPreview exam={previewExam} index={examIndex} total={exams.length} onClose={closePreview} onPrev={() => movePreview(-1)} onNext={() => movePreview(1)}
        onShare={(k) => showToast(k === "send" ? `${previewExam.title} enviado a Camila pelo WhatsApp` : `No app, este botão baixa ${previewExam.file}`, { icon: k === "send" ? "Send" : "Download", tone: k === "send" ? "ai" : "ok" })} />}
      <Toast toast={toast} onUndo={undo} onClose={() => setToast(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
