const hm = (s) => `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}`;
const hms = (s) => `${hm(s)}:${pad(Math.floor(s % 60))}`;

const TYPES = { helena: ["Consulta", "Retorno", "Mapeamento de nevos", "Biópsia de pele", "Primeira consulta"], ramos: ["Consulta", "Retorno", "Avaliação", "Infiltração", "Primeira consulta"], okada: ["Consulta", "Retorno · ECG", "Primeira consulta", "Retorno", "Consulta · palpitações"], menezes: ["Consulta", "Retorno · HbA1c", "Retorno", "Primeira consulta", "Consulta · tireoide"] };

// PRNG determinístico por semente (mesma agenda a cada carregamento).
function rng(seed) { let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const hash = (s) => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };

const FORCE_FREE = new Set(["ramos:" + T(14, 30), "ramos:" + T(15, 0)]);

const dayCache = {};
function genDay(key) {
  if (dayCache[key]) return dayCache[key];
  const date = fromKey(key);
  const isToday = key === TODAY;
  const past = key < TODAY;
  const out = [];
  let n = 0;
  if (isToday) TODAY_FIXED.forEach((a) => out.push({ ...a, id: `${key}-${a.doc}-${hm(a.t)}-${n++}`, date: key, dur: DOCS[a.doc].slot }));
  DOC_IDS.forEach((doc) => {
    const r = rng(key + doc);
    const dur = DOCS[doc].slot;
    windowsFor(doc, date).forEach(([s, e]) => {
      for (let t = s; t + dur * 60 <= e; t += dur * 60) {
        if (FORCE_FREE.has(doc + ":" + t) && isToday) continue;
        if (out.some((a) => a.doc === doc && t < a.t + a.dur * 60 && t + dur * 60 > a.t)) continue;
        const fill = past ? 0.86 : isToday ? (t < START ? 0.9 : 0.72) : 0.62;
        if (r() > fill) continue;
        const name = NAMES[Math.floor(r() * NAMES.length)];
        const type = TYPES[doc][Math.floor(r() * TYPES[doc].length)];
        const payer = PAYERS[Math.floor(r() * PAYERS.length)];
        let status;
        if (past || (isToday && t + dur * 60 <= START)) status = r() < 0.08 ? "cancelada" : "concluida";
        else status = r() < 0.66 ? "confirmada" : "agendada";
        const a = { id: `${key}-${doc}-${hm(t)}-${n++}`, date: key, doc, t, dur, name, type, payer, status };
        if (status === "confirmada") a.confirmedAt = T(7, 30) + Math.floor(r() * 7200);
        if (status === "cancelada") a.cancelledAt = t - 86400;
        out.push(a);
      }
    });
  });
  out.sort((a, b) => a.t - b.t || DOC_IDS.indexOf(a.doc) - DOC_IDS.indexOf(b.doc));
  dayCache[key] = out;
  return out;
}

}

  return { age, allergy, history: H, exams, phone: `(11) 9${pad(7000 + (h % 2999)).slice(0, 4)}-${pad(h % 9999)}` };

function thread(a, now) {
  const d = DOCS[a.doc];
  const date = fromKey(a.date);
  const when = `${WD[date.getDay()]} ${shortDate(date)} às ${hm(a.t)}`;
  const ask = { from: "copilot", t: T(7, 30), text: `Olá, ${first(a.name)}. Sua consulta com ${d.short} é ${when}. Responde SIM para confirmar ou REMARCAR para ver outros horários.` };
  if (a.status === "agendada") return { msgs: [ask, { from: "copilot", t: T(9, 30), text: "Lembrete: ainda não recebemos sua confirmação. Podemos manter o horário?" }], status: { tone: "warn", icon: "Clock", text: "Sem resposta · 3º lembrete às 12:00" } };
  if (a.status === "cancelada") return { msgs: [ask, { from: "patient", t: a.cancelledAt || T(10, 39), text: "Não vou conseguir ir hoje, preciso desmarcar." }, { from: "copilot", t: (a.cancelledAt || T(10, 39)) + 30, text: "Sem problema. Desmarquei e já ofereci o horário à lista de espera. Quer que eu sugira uma nova data?" }], status: { tone: "bad", icon: "CalendarX2", text: `Desmarcada ${hm(a.cancelledAt || T(10, 39))}` } };
  if (a.status === "smartfill") return { msgs: [{ from: "copilot", t: a.openedAt + 60, text: `Abriu uma vaga hoje às ${hm(a.t)} com ${d.name}. Quer ficar com ela?` }, { from: "patient", t: a.smartFillAt - 60, text: "Quero sim! Consigo chegar." }, { from: "copilot", t: a.smartFillAt, text: `Confirmado. Te espero às ${hm(a.t)}, ${d.room}. Chega 10 minutos antes para o check-in.` }], status: { tone: "ai", icon: "Zap", text: `Vaga aceita ${hm(a.smartFillAt)} · lista de espera` } };

/* ───────────────────────── cálculo de ocupação ───────────────────────── */
function dayStats(key) {
  const date = fromKey(key);
  const appts = genDay(key);
  let capacity = 0;
  DOC_IDS.forEach((doc) => windowsFor(doc, date).forEach(([s, e]) => { capacity += Math.floor((e - s) / (DOCS[doc].slot * 60)); }));
  const active = appts.filter((a) => a.status !== "cancelada");
  const filled = active.filter((a) => a.status !== "encaixe").length;
  return { capacity, filled, free: Math.max(0, capacity - filled), ratio: capacity ? filled / capacity : 0, smartfill: appts.filter((a) => a.status === "smartfill").length, cancelled: appts.filter((a) => a.status === "cancelada").length };
}
function freeSlots(key, appts, doc) {
  const date = fromKey(key);
  const dur = DOCS[doc].slot;
  const out = [];
  windowsFor(doc, date).forEach(([s, e]) => {
    for (let t = s; t + dur * 60 <= e; t += dur * 60) {
      if (FORCE_FREE.has(doc + ":" + t) && key === TODAY) continue;
      const busy = appts.some((a) => a.doc === doc && a.status !== "cancelada" && t < a.t + a.dur * 60 && t + dur * 60 > a.t);
      if (!busy) out.push({ key, doc, t, dur });
    }
  });
  return out;
}
// Ocupação por hora (0..1) ou null quando ninguém atende naquela hora.
function heatHour(key, h) {
  const date = fromKey(key);
  const hs = T(h, 0), he = T(h + 1, 0);
  let cap = 0, used = 0;
  DOC_IDS.forEach((doc) => windowsFor(doc, date).forEach(([s, e]) => { cap += Math.max(0, Math.min(e, he) - Math.max(s, hs)); }));
  if (!cap) return null;
  genDay(key).forEach((a) => { if (a.status === "cancelada") return; used += Math.max(0, Math.min(a.t + a.dur * 60, he) - Math.max(a.t, hs)); });
  return Math.min(1, used / cap);
}

function Summary({ dayKey, appts, now, onComms }) {

  const encaixes = DOC_IDS.reduce((n, d) => n + Math.min(free.filter((f) => f.doc === d).length, WAITLIST.byDoc[d] || 0), 0);

function DayView({ dayKey, appts, now, selectedId, onOpen, onSelect, onFree }) {
  const date = fromKey(dayKey);
  const columns = DOC_IDS.map((doc) => {
    const wins = windowsFor(doc, date);
    const closed = [];
    let cur = GRID_START;
    wins.forEach(([s, e]) => { if (s > cur) closed.push([cur, s]); cur = e; });
    if (cur < GRID_END) closed.push([cur, GRID_END]);
    const mine = appts.filter((a) => a.doc === doc);
    return { key: doc, title: DOCS[doc].short, sub: `${DOCS[doc].spec} · ${DOCS[doc].room}${wins.length ? "" : " · não atende"}`, color: DOCS[doc].color, isToday: dayKey === TODAY, count: mine.filter((a) => a.status !== "cancelada").length, appts: mine, free: freeSlots(dayKey, appts, doc), closed };
  });
  return <TimeGrid columns={columns} now={now} selectedId={selectedId} onOpen={onOpen} onSelect={onSelect} onFree={onFree} />;
}

function DoctorView({ doc, monday, now, selectedId, onOpen, onSelect, onFree, apptsFor }) {
  const columns = WEEKDAYS.map((wd) => {
    const date = addDays(monday, wd - 1);
    const key = dkey(date);
    const appts = apptsFor(key).filter((a) => a.doc === doc);
    const wins = windowsFor(doc, date);
    const closed = []; let cur = GRID_START;
    wins.forEach(([s, e]) => { if (s > cur) closed.push([cur, s]); cur = e; });
    if (cur < GRID_END) closed.push([cur, GRID_END]);
    return { key, title: `${WD[date.getDay()]} ${date.getDate()}`, sub: wins.length ? wins.map(([s, e]) => `${hm(s)}–${hm(e)}`).join(" · ") : "não atende", isToday: key === TODAY, count: appts.filter((a) => a.status !== "cancelada").length, appts, free: freeSlots(key, apptsFor(key), doc), closed, compact: true };
  });
  // estatísticas da semana
  let cap = 0, filled = 0, cancel = 0, sf = 0, agendada = 0;
  columns.forEach((c) => { cap += c.free.length + c.appts.filter((a) => a.status !== "cancelada").length; filled += c.appts.filter((a) => a.status !== "cancelada" && a.status !== "encaixe").length; cancel += c.appts.filter((a) => a.status === "cancelada").length; sf += c.appts.filter((a) => a.status === "smartfill").length; agendada += c.appts.filter((a) => a.status === "agendada").length; });
  const d = DOCS[doc];
  return (
    <div className="flex flex-col gap-4">
      <section aria-label={`Utilização de ${d.name} na semana`} className="grid grid-cols-2 gap-px overflow-hidden rounded-2xl border border-fg/[0.08] bg-fg/[0.08] lg:grid-cols-4">
        <div className="flex min-w-0 flex-col gap-1 bg-surface p-3.5 sm:p-4">
          <div className="flex items-center gap-2 text-[12px] font-medium text-muted"><span className="h-2.5 w-2.5 rounded-full" style={{ background: d.color }} />{d.name}</div>
          <div className="font-mono text-[24px] font-medium leading-none tracking-tight tnum">{Math.round((filled / Math.max(1, cap)) * 100)}<span className="ml-0.5 text-[15px] text-muted">%</span></div>
          <div className="text-[12px] text-muted">utilização · <span className="font-mono tnum">{filled}</span> de <span className="font-mono tnum">{cap}</span> horários na semana</div>
          <Meter value={filled / Math.max(1, cap)} tone={filled / Math.max(1, cap) >= 0.8 ? "ok" : "warn"} />
        </div>
        <Stat icon="CalendarRange" label="Livres na semana" value={cap - filled} tone={cap - filled ? "ok" : undefined} sub={`${WAITLIST.byDoc[doc] || 0} na lista de espera de ${d.spec.toLowerCase()}`} />
        <Stat icon="Clock" label="A confirmar" value={agendada} tone={agendada ? "warn" : undefined} sub="Copilot insiste até 48 h antes" />
        <Stat icon="Zap" label="Desmarcações repostas" value={`${sf}/${cancel}`} tone="ai" sub={cancel ? `${Math.round((sf / cancel) * 100)}% das vagas recuperadas` : "nenhuma desmarcação"} />
      </section>
      <TimeGrid columns={columns} now={now} selectedId={selectedId} onOpen={onOpen} onSelect={onSelect} onFree={onFree} minColumn={150} />
    </div>
  );
}

                  <span className="flex items-center gap-2 leading-none">
                    <span className="text-[11px] font-medium uppercase tracking-[0.06em] text-faint">{WD[d.date.getDay()]}</span>
                    <span className={cx("font-mono text-[15px] font-semibold tnum", isToday ? "text-ai" : "")}>{pad(d.date.getDate())}</span>
                    {isToday && <Chip tone="ai" className="py-[2px]">hoje</Chip>}
                    <span className={cx("ml-auto font-mono text-[13px] font-medium tnum", pct >= 85 ? "text-ok" : pct >= 60 ? "text-fg" : "text-warn")}>{pct}%</span>

                  <Meter value={d.stats.ratio} tone={pct >= 85 ? "ok" : pct >= 60 ? "fg" : "warn"} />

              {days.map((d) => {

                const isNow = d.key === TODAY && now >= T(h, 0) && now < T(h + 1, 0);
                const shown = inHour.slice(0, 3);
                return (
                  <div key={d.key} role="group" aria-label={`${WD[d.date.getDay()]} ${pad(h)}:00, ${v === null ? "fechado" : Math.round(v * 100) + "% ocupado"}, ${inHour.length} consultas`}
                    className={cx("relative min-h-[64px] border-r border-fg/[0.06] p-1 last:border-r-0", v === null ? "bg-sunken/70" : "", isNow ? "shadow-[inset_3px_0_0_rgb(var(--bad))]" : "")}

      <div className="flex flex-wrap items-center gap-x-4 gap-y-1.5 border-t border-fg/[0.06] px-4 py-2 text-[12px] text-muted">
        <span className="font-medium">Ocupação por hora</span>
        {[0, 0.25, 0.5, 0.75, 1].map((v) => <span key={v} className="inline-flex items-center gap-1.5"><span className="inline-block h-3 w-3 rounded-[3px] border border-fg/[0.08]" style={{ background: `rgb(var(--ok) / ${v * 0.42})` }} /><span className="font-mono tnum">{Math.round(v * 100)}%</span></span>)}
        <span className="inline-flex items-center gap-1.5"><span className="inline-block h-3 w-3 rounded-[3px] border border-fg/[0.08] bg-sunken" style={{ backgroundImage: "repeating-linear-gradient(135deg, rgb(var(--fg)/0.08) 0 2px, transparent 2px 4px)" }} />fechado</span>

      </div>
    </div>
  );

function Drawer({ a, now, open, onClose, onAction }) {
  const panel = useRef(null);
  useEffect(() => {
    if (!open || !panel.current) return;
    const el = panel.current;
    const t = setTimeout(() => { const f = el.querySelector("[data-autofocus]"); (f || el).focus({ preventScroll: true }); }, 30);
    return () => clearTimeout(t);
  }, [open, a && a.id]);
  const trap = (e) => {
    if (e.key !== "Tab" || !panel.current) return;
    const f = Array.from(panel.current.querySelectorAll("button, [href], input, [tabindex]:not([tabindex='-1'])")).filter((x) => !x.disabled);
    if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
  };
  const st = a && STATUS[a.status];
  const act = a && primaryAction(a);
  const pr = a && profile(a);
  const th = a && thread(a, now);
  return (
    <div className={cx("fixed inset-0 z-40 overflow-hidden", open ? "" : "pointer-events-none")} aria-hidden={!open}
      style={{ visibility: open ? "visible" : "hidden", transitionProperty: "visibility", transitionDuration: "0s", transitionDelay: open ? "0s" : "320ms" }}>

        ref={panel}

              <section aria-labelledby="dr-exams" className="px-4 pt-5">
                <div className="mb-2 flex items-center gap-2"><Icon n="Paperclip" size={15} className="text-muted" /><h3 id="dr-exams" className="text-[13px] font-semibold">Anexos de exames</h3><span className="ml-auto font-mono text-[11px] text-faint tnum">{pr.exams.length}</span></div>
                <ul className="grid grid-cols-2 gap-2">

                    <li key={i}>
                      <button type="button" onClick={() => onAction("exam", ex)} className="flex w-full flex-col gap-1.5 rounded-xl border border-fg/[0.08] bg-surface p-2 text-left transition-colors hover:border-fg/[0.16] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ai/40">

                        <span className="truncate text-[12px] font-medium">{ex.t}</span>

                      </button>

              <section aria-labelledby="dr-wa" className="px-4 pb-4 pt-5">
                <div className="mb-2 flex items-center gap-2"><Icon n="MessageCircle" size={15} className="text-muted" /><h3 id="dr-wa" className="text-[13px] font-semibold">Conversa no WhatsApp</h3><span className={cx("ml-auto inline-flex items-center gap-1 text-[12px] font-medium", TEXT[th.status.tone])}><Icon n={th.status.icon} size={12} sw={2} />{th.status.text}</span></div>
                <ol className="flex flex-col gap-1.5 rounded-xl border border-fg/[0.08] bg-sunken/60 p-2.5">
                  {th.msgs.map((m, i) => (
                    <li key={i} className={cx("flex max-w-[88%] flex-col gap-0.5 rounded-xl px-2.5 py-1.5 text-[12.5px] leading-snug", m.from === "copilot" ? "self-start rounded-bl-[4px] border border-fg/[0.08] bg-surface" : "self-end rounded-br-[4px] bg-ok/[0.12] text-fg")}>
                      <span className="flex items-center gap-1 text-[11px] text-faint">{m.from === "copilot" ? <><Icon n="Sparkles" size={10} className="text-ai" />Copilot</> : first(a.name)} · <span className="font-mono tnum">{hm(m.t)}</span></span>
                      <span>{m.text}</span>

                <button type="button" onClick={() => onAction("comms")} className="mt-2 inline-flex h-8 w-full items-center justify-center gap-1.5 rounded-lg border border-fg/[0.1] text-[12px] font-medium text-fg/80 hover:bg-sunken focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ai/40">Abrir conversa no Comms <Icon n="ArrowUpRight" size={13} /></button>
              </section>
            </div>

            <div className="flex items-center gap-2 border-t border-fg/[0.08] p-3" style={{ paddingBottom: "calc(12px + env(safe-area-inset-bottom, 0px))" }}>
              <button type="button" data-autofocus onClick={() => onAction(act.key)} className="inline-flex h-9 flex-1 items-center justify-center gap-2 rounded-lg border border-fg/90 bg-fg px-3 text-[13px] font-medium text-bg hover:bg-fg/85 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ai/40">
                <Icon n={act.icon} size={14} />{act.label}<Kbd className="border-bg/20 bg-bg/10 text-bg/80 shadow-none">↵</Kbd>
              </button>
              {act.key !== "reschedule" && a.status !== "concluida" && a.status !== "cancelada" && (
                <button type="button" onClick={() => onAction("reschedule")} className="inline-flex h-9 items-center gap-1.5 rounded-lg border border-fg/[0.1] bg-surface px-3 text-[13px] font-medium text-fg/80 hover:bg-sunken focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ai/40"><Icon n="CalendarClock" size={14} />Reagendar</button>
              )}
            </div>
          </>
        )}
      </section>
    </div>
  );
}

/* ───────────────────────── overlays (tela 1) ───────────────────────── */
function Overlay({ onClose, children, label, align = "top" }) {
  return (
    <div role="dialog" aria-modal="true" aria-label={label} className={cx("fixed inset-0 z-50 flex justify-center bg-black/40 px-4 backdrop-blur-[2px]", align === "top" ? "items-start pt-[12vh]" : "items-center")} onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div className="anim-pop w-full max-w-[560px] overflow-hidden rounded-2xl border border-fg/[0.1] bg-surface shadow-[0_32px_80px_-20px_rgb(0_0_0/0.35)]">{children}</div>
    </div>
  );
}

function CommandPalette({ items, onClose }) {
  const [q, setQ] = useState("");
  const [idx, setIdx] = useState(0);
  const listRef = useRef(null);
  const filtered = useMemo(() => {
    const n = norm(q.trim());
    return n ? items.filter((it) => norm(it.label + " " + (it.hint || "") + " " + it.group).includes(n)) : items;
  }, [q, items]);
  useEffect(() => setIdx(0), [q]);
  useEffect(() => { const el = listRef.current && listRef.current.querySelector(`[data-i="${idx}"]`); el && el.scrollIntoView({ block: "nearest" }); }, [idx]);
  const run = (it) => { onClose(); it && it.run(); };
  const onKey = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setIdx((i) => Math.min(i + 1, filtered.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setIdx((i) => Math.max(i - 1, 0)); }
    else if (e.key === "Enter") { e.preventDefault(); run(filtered[idx]); }
    else if (e.key === "Escape") { e.preventDefault(); onClose(); }
  };
  let lastGroup = null;
  return (
    <Overlay onClose={onClose} label="Busca rápida">
      <div className="flex items-center gap-2.5 border-b border-fg/[0.08] px-4">
        <Icon n="Search" size={16} className="text-muted" />
        <input id="cmdk-input" autoFocus value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={onKey} placeholder="Paciente, profissional ou ação…" aria-label="Buscar"
          className="h-12 flex-1 bg-transparent text-[15px] outline-none placeholder:text-faint" />
        <Kbd>Esc</Kbd>
      </div>
      <ul ref={listRef} className="max-h-[52vh] overflow-y-auto p-1.5" role="listbox" aria-label="Resultados">
        {filtered.length === 0 && <li className="px-3 py-8 text-center text-[13px] text-muted">Nada encontrado para “{q}”.</li>}
        {filtered.map((it, i) => {
          const head = it.group !== lastGroup ? (lastGroup = it.group) : null;
          return (
            <React.Fragment key={it.id}>
              {head && <li className="px-2.5 pb-1 pt-2.5 text-[11px] font-medium uppercase tracking-[0.06em] text-faint" role="presentation">{head}</li>}
              <li data-i={i} role="option" aria-selected={i === idx} onMouseMove={() => setIdx(i)} onClick={() => run(it)}
                className={cx("flex cursor-default items-center gap-3 rounded-lg px-2.5 py-2", i === idx ? "bg-sunken" : "")}>
                <span className={cx("inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-md border border-fg/[0.08]", it.tone ? TEXT[it.tone] : "text-muted")}><Icon n={it.icon} size={14} /></span>
                <span className="min-w-0 flex-1">
                  <span className="block truncate text-[13.5px] font-medium">{it.label}</span>
                  {it.hint && <span className="block truncate text-[12px] text-muted">{it.hint}</span>}
                </span>
                {it.kbd && <span className="flex gap-0.5">{it.kbd.map((k) => <Kbd key={k}>{k}</Kbd>)}</span>}
                {i === idx && <Icon n="CornerDownLeft" size={14} className="text-faint" />}
              </li>
            </React.Fragment>
          );
        })}
      </ul>
      <div className="flex items-center gap-4 border-t border-fg/[0.08] px-4 py-2 text-[12px] text-faint">
        <span className="inline-flex items-center gap-1"><Kbd>↑</Kbd><Kbd>↓</Kbd> navegar</span>
        <span className="inline-flex items-center gap-1"><Kbd>↵</Kbd> abrir</span>
        <span className="ml-auto">{filtered.length} resultados</span>
      </div>
    </Overlay>
  );
}

const SHORTCUTS = [
  ["Visão Dia / Semana / Médico", ["1", "2", "3"]],
  ["Dia ou semana anterior / seguinte", ["←", "→"]],
  ["Voltar para hoje", ["T"]],
  ["Consulta anterior / seguinte", ["↑", "↓"]],
  ["Abrir painel da consulta (ou executar a ação principal)", ["↵"]],
  ["Fechar painel", ["Esc"]],
  ["Desfazer última ação", ["Z"]],
  ["Busca rápida", ["Ctrl", "K"]],
  ["Esta lista", ["?"]],
];
function ShortcutsDialog({ onClose }) {
  const ref = useRef(null);
  useEffect(() => { ref.current && ref.current.focus(); }, []);
  return (
    <Overlay onClose={onClose} label="Atalhos de teclado" align="center">
      <div ref={ref} tabIndex={-1} onKeyDown={(e) => (e.key === "Escape" || e.key === "?") && onClose()} className="outline-none">
        <div className="flex items-center gap-2 border-b border-fg/[0.08] p-4"><Icon n="Keyboard" size={16} className="text-muted" /><h2 className="text-[15px] font-semibold">Atalhos da agenda</h2><span className="ml-auto"><Kbd>Esc</Kbd></span></div>
        <ul className="divide-y divide-fg/[0.06] px-4 py-1">
          {SHORTCUTS.map(([label, keys]) => (
            <li key={label} className="flex items-center justify-between gap-4 py-2.5 text-[13px]"><span>{label}</span><span className="flex gap-1">{keys.map((k) => <Kbd key={k}>{k}</Kbd>)}</span></li>
          ))}
        </ul>
      </div>

}

function Toast({ toast, onUndo, onClose }) {
  if (!toast) return null;
  return (
    <div className="pointer-events-none fixed inset-x-0 z-[60] flex justify-center px-4" style={{ bottom: "calc(16px + env(safe-area-inset-bottom, 0px))" }}>
      <div key={toast.id} role="status" className="anim-pop pointer-events-auto flex max-w-[560px] items-center gap-3 rounded-xl border border-fg/[0.1] bg-fg py-2 pl-3 pr-2 text-[13px] text-bg shadow-[0_20px_50px_-20px_rgb(0_0_0/0.5)]">
        <Icon n={toast.icon || "Check"} size={15} className={toast.tone === "ai" ? "text-[rgb(var(--ai))]" : "text-[rgb(var(--ok))]"} />
        <span className="min-w-0 flex-1">{toast.msg}</span>
        {toast.undo && (
          <button type="button" onClick={onUndo} className="inline-flex h-7 shrink-0 items-center gap-1.5 rounded-lg px-2 font-medium text-bg/80 hover:bg-bg/10">
            Desfazer <Kbd className="border-bg/20 bg-bg/10 text-bg/80 shadow-none">Z</Kbd>
          </button>
        )}
        <button type="button" onClick={onClose} aria-label="Fechar aviso" className="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-lg text-bg/60 hover:bg-bg/10"><Icon n="X" size={14} /></button>
      </div>
    </div>
  );
}

/* ───────────────────────── app ───────────────────────── */
function App() {
  const [now, setNow] = useState(START);
  const [view, setView] = useState("day");
  const [cursor, setCursor] = useState(new Date(BASE_DATE));
  const [doctor, setDoctor] = useState("okada");
  const [overrides, setOverrides] = useState({}); // dateKey → appts (edições locais sobre o mock)
  const [selectedId, setSelectedId] = useState(null);
  const [drawerId, setDrawerId] = useState(null);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [palette, setPalette] = useState(false);
  const [help, setHelp] = useState(false);
  const [toast, setToast] = useState(null);
  const lastFocusRef = useRef(null);

  useEffect(() => { const t = setInterval(() => setNow((n) => n + 1), 1000); return () => clearInterval(t); }, []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 6000); return () => clearTimeout(t); }, [toast]);

  const apptsFor = useCallback((key) => overrides[key] || genDay(key), [overrides]);
  const dayKey = dkey(cursor);
  const monday = mondayOf(cursor);
  const dayAppts = apptsFor(dayKey);

  // lista ordenada de consultas visíveis (para ↑↓)
  const ordered = useMemo(() => {
    // Desmarcadas ficam fora da navegação por teclado: a reposta (smartfill) já conta a história.
    if (view === "day") return dayAppts.filter((a) => a.status !== "cancelada");
    const days = WEEKDAYS.map((wd) => dkey(addDays(monday, wd - 1)));
    const all = days.flatMap((k) => apptsFor(k)).filter((a) => a.status !== "cancelada");
    return view === "doctor" ? all.filter((a) => a.doc === doctor) : all;
  }, [view, dayAppts, monday, doctor, apptsFor]);

  const findAppt = (id) => { for (const k of Object.keys(dayCache).concat(Object.keys(overrides))) { const a = apptsFor(k).find((x) => x.id === id); if (a) return a; } return null; };
  const drawerAppt = drawerId ? findAppt(drawerId) : null;

  const showToast = (msg, opts = {}) => setToast({ id: Math.random(), msg, ...opts });
  const focusBlock = (id) => requestAnimationFrame(() => {
    const el = document.querySelector(`[data-aid="${id}"]`);
    if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" }); }
  });

  const openDrawer = (id) => { lastFocusRef.current = id; setSelectedId(id); setDrawerId(id); setDrawerOpen(true); };
  const closeDrawer = () => { setDrawerOpen(false); const id = lastFocusRef.current; id && focusBlock(id); };

  const patchAppt = (id, fields) => {
    const a = findAppt(id); if (!a) return null;
    const prev = overrides;
    setOverrides((o) => ({ ...o, [a.date]: apptsFor(a.date).map((x) => (x.id === id ? { ...x, ...fields } : x)) }));
    return prev;
  };

  function action(key, payload) {
    const a = drawerAppt; if (!a && key !== "exam" && key !== "comms") return;
    if (key === "comms") { closeDrawer(); navigate("O Comms"); return; }
    if (key === "exam") { showToast(`Abrindo ${payload.t} (${payload.d}) no visualizador de documentos`, { icon: "FileText", tone: "ai" }); return; }
    if (key === "confirm") {
      const prev = patchAppt(a.id, { status: "confirmada", confirmedAt: now });
      showToast(`${a.name} confirmado manualmente · Copilot para de lembrar`, { icon: "CheckCheck", undo: prev });
    } else if (key === "checkin") {
      const prev = patchAppt(a.id, { status: "checkin", checkedInAt: now });
      showToast(`${a.name} fez check-in · aparece no Cockpit em "Na recepção"`, { icon: "LogIn", undo: prev });
      closeDrawer();
    } else if (key === "followup") {
      showToast(`Copilot vai propor retorno em 30 dias a ${first(a.name)} pelo WhatsApp`, { icon: "CalendarPlus", tone: "ai" });
    } else if (key === "offer") {
      showToast(`Vaga ${hm(a.t)} oferecida a ${WAITLIST.byDoc[a.doc] || 0} pacientes da lista de espera · acompanhe no Comms`, { icon: "Zap", tone: "ai" });
      closeDrawer();
    } else if (key === "reschedule") {
      showToast(`Copilot enviou 3 horários a ${first(a.name)} pelo WhatsApp · a vaga ${hm(a.t)} vai para o Smart Waitlist se ele aceitar`, { icon: "CalendarClock", tone: "ai" });
      closeDrawer();
    }
  }

  function reserveFree(f) {
    const target = f.key || dayKey;
    const prev = overrides;
    const id = `${target}-${f.doc}-${hm(f.t)}-enc`;
    const a = { id, date: target, doc: f.doc, t: f.t, dur: f.dur, name: "Lista de espera", type: "Encaixe", payer: conv("a definir"), status: "encaixe" };
    setOverrides((o) => ({ ...o, [target]: [...apptsFor(target), a].sort((x, y) => x.t - y.t) }));
    showToast(`Encaixe ${hm(f.t)} · ${DOCS[f.doc].short} reservado. Copilot oferece à lista de espera.`, { icon: "ListPlus", tone: "ai", undo: prev });
    setSelectedId(id); focusBlock(id);
  }

  function undo() {
    if (!toast || !toast.undo) return;
    setOverrides(toast.undo);
    setToast({ id: Math.random(), msg: "Ação desfeita", icon: "Undo2", tone: "ai" });
  }

  const navigate = (label) => showToast(`${label} é outra tela desta série. A agenda continua ao vivo.`, { icon: "LayoutGrid", tone: "ai" });

  function move(dir) {
    if (!ordered.length) return;
    let i = ordered.findIndex((a) => a.id === selectedId);
    if (i < 0) i = dir > 0 ? -1 : ordered.length;
    i = Math.max(0, Math.min(ordered.length - 1, i + dir));
    const id = ordered[i].id;
    setSelectedId(id); focusBlock(id);
    if (drawerOpen) { setDrawerId(id); lastFocusRef.current = id; }
  }

  useEffect(() => {
    const onKey = (e) => {
      const k = e.key.toLowerCase();
      if ((e.metaKey || e.ctrlKey) && k === "k") { e.preventDefault(); setPalette((o) => !o); return; }
      if (palette || help) return;
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea") return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "/") { e.preventDefault(); setPalette(true); return; }
      if (e.key === "?") { e.preventDefault(); setHelp(true); return; }
      if (e.key === "Escape") { if (drawerOpen) closeDrawer(); else setSelectedId(null); return; }
      if (k === "z") { e.preventDefault(); undo(); return; }
      if (k === "t") { e.preventDefault(); setCursor(new Date(BASE_DATE)); return; }
      if (["1", "2", "3"].includes(e.key)) { e.preventDefault(); setView(VIEWS[Number(e.key) - 1].id); return; }
      if (k === "arrowleft" || k === "arrowright") { e.preventDefault(); setCursor((c) => addDays(c, (k === "arrowleft" ? -1 : 1) * (view === "day" ? 1 : 7))); return; }
      if (k === "arrowdown" || k === "arrowup") { e.preventDefault(); move(k === "arrowdown" ? 1 : -1); return; }
      if (e.key === "Enter") {
        if (tag === "button" || tag === "a") return; // o clique nativo já faz o trabalho
        if (drawerOpen && drawerAppt) { e.preventDefault(); action(primaryAction(drawerAppt).key); return; }
        if (selectedId) { e.preventDefault(); openDrawer(selectedId); }
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const closeOverlay = (setter) => () => { setter(false); const id = lastFocusRef.current || selectedId; id && focusBlock(id); };

  const paletteItems = useMemo(() => {
    const items = dayAppts.filter((a) => a.status !== "encaixe").map((a) => ({
      id: "p-" + a.id, group: dayKey === TODAY ? "Consultas de hoje" : `Consultas de ${shortDate(cursor)}`, icon: a.status === "smartfill" ? "Zap" : "UserRound", tone: a.status === "smartfill" ? "ai" : undefined, label: a.name,
      hint: `${hm(a.t)} · ${DOCS[a.doc].short} · ${STATUS[a.status].label}`,
      run: () => { if (view !== "day") setView("day"); openDrawer(a.id); },
    }));
    const actions = [
      { id: "a-day", group: "Ações", icon: "Columns3", label: "Visão Dia", kbd: ["1"], run: () => setView("day") },
      { id: "a-week", group: "Ações", icon: "LayoutGrid", label: "Visão Semana", hint: "Mapa de calor de ocupação", kbd: ["2"], run: () => setView("week") },
      { id: "a-doc", group: "Ações", icon: "UserRound", label: "Visão por médico", kbd: ["3"], run: () => setView("doctor") },
      { id: "a-today", group: "Ações", icon: "Undo2", label: "Ir para hoje", kbd: ["T"], run: () => setCursor(new Date(BASE_DATE)) },
      { id: "a-sf", group: "Ações", icon: "Zap", tone: "ai", label: "Ver vaga reposta pelo Smart Waitlist", hint: "14:00 · Dr. Ramos · Mariana Costa", run: () => { setCursor(new Date(BASE_DATE)); setView("day"); const a = genDay(TODAY).find((x) => x.status === "smartfill" && x.callout); a && openDrawer(a.id); } },
      { id: "a-theme", group: "Ações", icon: "SunMoon", label: "Alternar tema claro e escuro", run: () => window.__toggleTheme && window.__toggleTheme() },
      { id: "a-help", group: "Ações", icon: "Keyboard", label: "Mostrar atalhos de teclado", kbd: ["?"], run: () => setHelp(true) },
    ];
    const docs = DOC_IDS.map((id) => ({ id: "d-" + id, group: "Profissionais", icon: "Stethoscope", label: DOCS[id].name, hint: `${DOCS[id].spec} · agenda da semana`, run: () => { setDoctor(id); setView("doctor"); } }));
    const nav = [
      { id: "n-cockpit", group: "Ir para", icon: "LayoutGrid", label: "Cockpit", hint: "Fluxo ao vivo da clínica", run: () => navigate("O Cockpit") },
      { id: "n-comms", group: "Ir para", icon: "MessagesSquare", label: "Comms e Smart Waitlist", hint: `${WAITLIST.total} pacientes na lista de espera`, run: () => navigate("O Comms") },
      { id: "n-p360", group: "Ir para", icon: "UsersRound", label: "Paciente 360", hint: "Ficha, exames e continuidade", run: () => navigate("O Paciente 360") },
    ];
    return [...actions, ...items, ...docs, ...nav];
  }, [dayAppts, dayKey, view]);

  return (
    <div className="min-h-full">
      <Header now={now} view={view} setView={setView} cursor={cursor} setCursor={setCursor} doctor={doctor} setDoctor={setDoctor} onOpenPalette={() => setPalette(true)} onNavigate={navigate} />

      <main className="mx-auto flex max-w-[1680px] flex-col gap-4 px-4 pb-24 pt-4 sm:px-6">
        <div className="flex flex-wrap items-center gap-x-3 gap-y-1 px-1">
          <h1 className="text-[15px] font-semibold tracking-tight">{view === "day" ? "Agenda do dia" : view === "week" ? "Semana" : `Agenda de ${DOCS[doctor].short}`}</h1>
          <span className="text-[12px] text-muted">{view === "day" ? "uma coluna por profissional · horários livres clicáveis" : view === "week" ? "ocupação por hora · clique no dia para abrir" : "seis dias lado a lado · utilização da semana"}</span>
          <button type="button" onClick={() => setHelp(true)} className="ml-auto hidden items-center gap-1.5 rounded-md px-1.5 py-1 text-[12px] text-muted hover:bg-sunken hover:text-fg sm:inline-flex"><Kbd>?</Kbd>atalhos</button>
        </div>

        {view !== "doctor" && <Summary dayKey={view === "day" ? dayKey : TODAY} appts={view === "day" ? dayAppts : apptsFor(TODAY)} now={now} onComms={() => navigate("O Comms")} />}

        {view === "day" && <DayView dayKey={dayKey} appts={dayAppts} now={now} selectedId={selectedId} onOpen={openDrawer} onSelect={setSelectedId} onFree={reserveFree} />}
        {view === "week" && <WeekView monday={monday} now={now} selectedId={selectedId} onOpen={openDrawer} onSelect={setSelectedId} apptsFor={apptsFor} setCursor={setCursor} setView={setView} />}
        {view === "doctor" && <DoctorView doc={doctor} monday={monday} now={now} selectedId={selectedId} onOpen={openDrawer} onSelect={setSelectedId} onFree={reserveFree} apptsFor={apptsFor} />}

        <footer className="hidden flex-wrap items-center gap-x-4 gap-y-2 border-t border-fg/[0.06] px-1 pt-3 text-[12px] text-muted md:flex">
          {[["1 2 3", "visão"], ["← →", view === "day" ? "dia" : "semana"], ["T", "hoje"], ["↑ ↓", "consulta"], ["↵", "abrir"], ["Esc", "fechar"], ["Z", "desfazer"]].map(([k, l]) => (
            <span key={k} className="inline-flex items-center gap-1.5"><Kbd>{k}</Kbd>{l}</span>
          ))}
          <span className="ml-auto text-faint">Dados de exemplo · {CLINIC}</span>
        </footer>
      </main>

      <Drawer a={drawerAppt} now={now} open={drawerOpen && !!drawerAppt} onClose={closeDrawer} onAction={action} />
      {palette && <CommandPalette items={paletteItems} onClose={closeOverlay(setPalette)} />}
      {help && <ShortcutsDialog onClose={closeOverlay(setHelp)} />}
      <Toast toast={toast} onUndo={undo} onClose={() => setToast(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
