<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="ClinicFlow é o cockpit da clínica: prevenção de faltas por WhatsApp, sala de espera ao vivo e agenda multiprofissional."
    />
    <title>ClinicFlow — Cockpit clínico</title>
  </head>
  <body>
    <script>
      // Aplica o tema antes da primeira pintura. Sem isto, quem escolheu escuro
      // vê um lampejo branco a cada carregamento.
      try {
        let t = localStorage.getItem("clinicflow.theme");
        if (t !== "dark" && t !== "light")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
        // A barra do navegador acompanha o surface-app do tema já na carga.
        if (t === "dark")
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#020617");
      } catch {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
