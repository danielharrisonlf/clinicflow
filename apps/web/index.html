<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f6fa" />
    <meta
      name="description"
      content="ClinicFlow organiza agenda, chegadas, documentos e retornos em um fluxo claro para a recepção da clínica."
    />
    <title>ClinicFlow — A rotina da recepção, em fluxo</title>
  </head>
  <body>
    <script>
      // Aplica o tema antes da primeira pintura. Sem isto, quem escolheu escuro
      // vê um lampejo branco a cada carregamento.
      try {
        let t = localStorage.getItem("clinicflow.theme");
        if (t !== "dark" && t !== "light")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
