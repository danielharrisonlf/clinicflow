services:
  postgres:
    image: postgres:16-alpine
    container_name: clinicflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinicflow
      POSTGRES_PASSWORD: clinicflow
      POSTGRES_DB: clinicflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicflow -d clinicflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clinicflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Armazenamento S3-compatível para exercitar o módulo de upload sem AWS.
  # Console em http://localhost:9001 (minioadmin / minioadmin).
  minio:
    image: minio/minio:latest
    container_name: clinicflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: clinicflow-api
    build:
      context: .
      target: dev
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  web:
    container_name: clinicflow-web
    build:
      context: .
      target: dev
      dockerfile: apps/web/Dockerfile
    env_file:
      - ./apps/web/.env
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: clinicflow-network
    driver: bridge
